[package]
name = "host-router-quic-bench"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
anyhow = "1.0"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-util", "time"] }
serde_json = "1.0"
[profile.release]
lto = "thin"
strip = true
